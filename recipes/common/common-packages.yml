modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
      #  - bebeb/nautilus-kgx
        - trixieua/mutter-patched
        - trixieua/mesa-clang
        - trixieua/morewaita-icon-theme
        - imput/helium
        - ublue-os/packages
        - bieszczaders/kernel-cachyos-addons
    install:
      allow-erasing: true
      packages:
        - alsa-firmware
        - gvfs-nfs
        - adw-gtk3-theme
        - bat
        - bazaar
        - baobab
        - morewaita-icon-theme
        - smartmontools
        - fastfetch
        - gnome-tweaks
        - distrobox
        - helium-bin
      #  - gnome-console
        - gnome-logs
        - gnome-text-editor
        - libva-intel-driver
        - lshw
        - zstd
        - ffmpeg
        - ffmpeg-libs
        - ffmpegthumbnailer
        - sushi
        - uupd
        - scx-scheds
        - scx-tools
        - nautilus-python
        - python-dbus
        - noopenh264
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - toolbox
      #  - ptyxis
        - gnome-classic-session
        - gnome-software
        - gnome-system-monitor
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-background-logo
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-places-menu
        - gnome-shell-extension-window-list
        - totem-video-thumbnailer
        - gstreamer1-plugin-openh264
    #replace:
    #  - from-repo: copr:copr.fedorainfracloud.org:bebeb:nautilus-kgx
    #    packages:
    #      - nautilus
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:trixieua:mutter-patched
        skip-unavailable: true
        packages:
          - mutter
          - mutter-common
          - gdm
          - gnome-shell
          - gnome-shell-common
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:trixieua:mesa-clang
        skip-unavailable: true
        packages:
          - mesa-filesystem
          - mesa-libgbm
          - mesa-dri-drivers
          - mesa-libEGL
          - mesa-libGL
          - mesa-vulkan-drivers
          - mesa-va-drivers

    group-install:
      with-optional: false
      packages:
        - multimedia
      exclude:
        - PackageKit-gstreamer-plugin
  
  - type: script
    scripts:
      - updates-testing.sh
      - fuck-cisco.sh

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
      - scope: system
        repo:
          title: Flathub
        notify: true
        install:
          - com.github.tchx84.Flatseal
          - org.gnome.World.PikaBackup
          - com.mattjakeman.ExtensionManager
          - io.github.nozwock.Packet
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Contacts
          - org.gnome.Decibels
          - org.gnome.SimpleScan
          - org.gnome.Papers
          - org.gnome.font-viewer
          - org.gnome.Loupe
          - org.gnome.Maps
          - org.gnome.Snapshot
          - org.gnome.Showtime
          - org.gnome.Weather
          - net.nokyan.Resources
          - it.mijorus.gearlever

  - type: brew
    nofile-limits: true
    brew-analytics: false