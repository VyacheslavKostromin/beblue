modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
      #  - bebeb/nautilus-kgx
        - trixieua/mutter-patched
        - trixieua/mesa-clang
        - trixieua/morewaita-icon-theme
        - imput/helium
        - ublue-os/packages
        - bieszczaders/kernel-cachyos-addons
    install:
      allow-erasing: true
      packages:
        - alsa-firmware
        - gvfs-nfs
        - adw-gtk3-theme
        - bat
        - bazaar
        - morewaita-icon-theme
        - smartmontools
        - fastfetch
        - gnome-tweaks
        - distrobox
        - helium-bin
      #  - gnome-console
        - gnome-logs
        - gnome-text-editor
        - libva-intel-driver
        - lshw
        - zstd
        - ffmpeg
        - ffmpegthumbnailer
        - sushi
        - uupd
        - scx-scheds
        - scx-tools
        - nautilus-python
        - python-dbus
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - toolbox
      #  - ptyxis
        - gnome-classic-session
        - gnome-software
        - gnome-system-monitor
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-background-logo
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-places-menu
        - gnome-shell-extension-window-list
        - totem-video-thumbnailer
    #replace:
    #  - from-repo: copr:copr.fedorainfracloud.org:bebeb:nautilus-kgx
    #    packages:
    #      - nautilus
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:trixieua:mutter-patched
        skip-unavailable: true
        packages:
          - mutter
          - mutter-common
          - gdm
          - gnome-shell
          - gnome-shell-common
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:trixieua:mesa-clang
        skip-unavailable: true
        packages:
          - mesa-filesystem
          - mesa-libgbm
          - mesa-dri-drivers
          - mesa-libEGL
          - mesa-libGL
          - mesa-vulkan-drivers
          - mesa-va-drivers

    group-install:
      with-optional: false
      packages:
        - multimedia
      exclude:
        - PackageKit-gstreamer-plugin
  
  - type: script
    scripts:
      - updates-testing.sh

  - type: default-flatpaks
    configurations:
      - scope: system
        repo:
          title: Flathub
        notify: false

  - type: soar
    additional-repos: true
    auto-upgrade: true
    upgrade-interval: '1d'