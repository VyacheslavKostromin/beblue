modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
      #  - bebeb/nautilus-kgx
        - trixieua/mutter-patched
        - trixieua/mesa-clang
        - trixieua/morewaita-icon-theme
        - imput/helium
    install:
      allow-erasing: true
      packages:
        - adw-gtk3-theme
        - bat
        - morewaita-icon-theme
        - smartmontools
        - fastfetch
        - gnome-tweaks
        - distrobox
        - helium-bin
      #  - gnome-console
        - gnome-backgrounds-extras
        - gnome-logs
        - gnome-text-editor
        - libva-intel-driver
        - ffmpeg
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - toolbox
      #  - ptyxis
        - gnome-classic-session
        - gnome-software
        - gnome-system-monitor
    #replace:
    #  - from-repo: copr:copr.fedorainfracloud.org:bebeb:nautilus-kgx
    #    packages:
    #      - nautilus
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:trixieua:mutter-patched
        skip-unavailable: true
        packages:
          - mutter
          - mutter-common
          - gdm
          - gnome-shell
          - gnome-shell-common
          - xorg-x11-server-Xwayland
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:trixieua:mesa-clang
        skip-unavailable: true
        packages:
          - mesa-filesystem
          - mesa-libgbm
          - mesa-dri-drivers
          - mesa-libEGL
          - mesa-libGL
          - mesa-vulkan-drivers
          - mesa-va-drivers

    group-install:
      with-optional: false
      packages:
        - multimedia
      exclude:
        - PackageKit-gstreamer-plugin

  - type: default-flatpaks
    configurations:
      - scope: system
        install: # system flatpaks we want all users to have and not remove
          - io.github.kolunmi.Bazaar
          - org.gnome.Loupe
          - org.gnome.Decibels
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Snapshot
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.baobab
          - org.gnome.SimpleScan
          - org.gnome.Papers
          - org.gnome.font-viewer
          - org.gnome.Showtime
          - org.gnome.Weather
          - net.nokyan.Resources
          - io.github.nozwock.Packet
          - com.github.tchx84.Flatseal
          - com.mattjakeman.ExtensionManager
          - org.gnome.FileRoller

  - type: soar
    additional-repos: true
    auto-upgrade: true
    upgrade-interval: '1d'