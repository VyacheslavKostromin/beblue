modules:
  - type: kargs
    arch: x86_64
    kargs:
      - preempt=full
      - mitigations=off
      - nowatchdog
      - zswap.enabled=1
      - zswap.compressor=zstd
      - zswap.shrinker_enabled=1
      - zswap.max_pool_percent=30

  - type: systemd
    system:
      enabled:
        - uupd.timer