modules:
  - type: kargs
    arch: x86_64
    kargs:
      - preempt=full
      - mitigations=off
      - nowatchdog

  - type: systemd
    system:
      enabled:
        - bootc-fetch-apply-updates.timer
        - bootc-fetch-apply-updates.service
        - dconf-update.service
      masked:
        - rpm-ostreed-automatic.timer